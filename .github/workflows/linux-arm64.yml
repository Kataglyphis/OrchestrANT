name: Linux arm64 · build + test

# Python versions must match linux-x64.yml's; no FTP secrets, because only the x64 row deploys the docs.

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml, release.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-linux.yml@develop
    with:
      arches: arm64
      package-name: orchestrant
      # The free-threaded leg syncs only the test extra (OpenCV and the chain ORT have no free-threaded wheels) and gates.
      free-threaded-extras: test
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # Inside the image every library is present; a bare runner shows whether the packages carry their glibc and GStreamer.
  clean-host:
    name: Packages on a clean Ubuntu 26.04 (arm64)
    needs: linux
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - name: Install and start the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: packages-linux-arm64-source-and-binary
          subdir: packages
          deb: '*.deb'
          deb-command: yolo-monitor --self-test
          tarball: '*.tar.gz'
          tarball-command: ./bin/yolo-monitor --self-test
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --self-test'
          # The chain ORT stays unpatched for G6 and loads through preload.list, which ldd cannot follow.
          scan-elves: 'false'
