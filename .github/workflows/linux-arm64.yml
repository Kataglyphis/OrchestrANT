name: Linux arm64 · build + test

# Python versions must match linux-x64.yml's; no FTP secrets, because only the x64 row deploys the docs.

# On request (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml or by hand; a v* tag still releases.
on:
  push:
    # A v* tag builds the same lane and attaches its tar.gz, deb and AppImage to the tag's release.
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-linux.yml@develop
    with:
      arches: arm64
      package-name: orchestrant
      # The free-threaded leg syncs only the test extra (OpenCV and the chain ORT have no free-threaded wheels) and gates.
      free-threaded-extras: test
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: linux
    permissions:
      contents: write
    uses: Kataglyphis/ANTfrastructure/.github/workflows/release-packages.yml@develop
    with:
      artifact-pattern: packages-linux-*
