name: Linux arm64 · build + test

# Python versions must match linux-x64.yml's; no FTP secrets, because only the x64 row deploys the docs.

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml, release.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-linux.yml@develop
    with:
      arches: arm64
      package-name: orchestrant
      # The free-threaded leg syncs only the test extra (OpenCV and the chain ORT have no free-threaded wheels) and gates.
      free-threaded-extras: test
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
