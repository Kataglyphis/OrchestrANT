name: Windows x64 · build + test

# No paths filter: it would narrow the container build along with the PowerShell lint.

# On request only (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md): on-request.yml, release.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  windows:
    # No image or runs-on on purpose; never pass `image: ''` (GitHub defaults only an ABSENT input).
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-windows.yml@develop
    with:
      # Shallow checkout is fine here: the version comes from VERSION.txt, not git.
      fetch-depth: 1
      lint-powershell: true
      # Must match scripts/windows/Invoke-Lint.ps1, this gate's dev-box twin.
      lint-path: scripts/windows
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
