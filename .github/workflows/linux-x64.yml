name: Linux x64 · build + test

# Python versions must match linux-arm64.yml's; only this row deploys the docs, so only it gets the FTP secrets.

# The one build lane every push to develop runs; release.yml calls it on main (https://github.com/Kataglyphis/ANTfrastructure/blob/develop/docs/branch-and-release-strategy.md).
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux:
    # No container-image on purpose: the lane's fallback is the versions.env image the ref gate holds.
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-linux.yml@develop
    with:
      arches: x64
      # The importable module, not the distribution name ("OrchestrANT").
      package-name: orchestrant
      # No version named: the hub runs the pinned X.Y and its X.Yt twin, which syncs only the test extra and gates.
      free-threaded-extras: test
      # Each leg's verify-test-reports.py fails below 60 % of package lines; the free-threaded leg, which lacks OpenCV and GenAI, sets the bound.
      coverage-min: '60'
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      # This repo stores the FTP password as PW; the lane's input name is neutral.
      FTP_PASSWORD: ${{ secrets.PW }}

  # Each leg's hot-path timings against the median of earlier develop runs; nothing gates, as shared-runner wall time drifts by SKU.
  bench-history:
    name: Benchmark history (x64)
    needs: linux
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download the test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports-x64
          path: test-reports
      - name: Hot paths, Python X.Y
        uses: Kataglyphis/ANTfrastructure/.github/actions/bench-history@develop
        with:
          key: hot-paths-x64-gil
          format: orchestrant-bench
          result: test-reports/bench/orchestrant-hot-paths-gil.json
          metrics: '{"*/p50_ms": {"direction": "lower"}, "*/p95_ms": {"direction": "lower"}}'
      - name: Hot paths, Python X.Yt
        if: ${{ !cancelled() }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/bench-history@develop
        with:
          key: hot-paths-x64-free-threaded
          format: orchestrant-bench
          result: test-reports/bench/orchestrant-hot-paths-free-threaded.json
          metrics: '{"*/p50_ms": {"direction": "lower"}, "*/p95_ms": {"direction": "lower"}}'

  # Inside the image every library is present; a bare runner shows whether the packages carry their glibc and GStreamer.
  clean-host:
    name: Packages on a clean Ubuntu 26.04 (x64)
    needs: linux
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Install and start the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: packages-linux-x64-source-and-binary
          subdir: packages
          deb: '*.deb'
          deb-command: yolo-monitor --self-test
          tarball: '*.tar.gz'
          tarball-command: ./bin/yolo-monitor --self-test
          appimage: '*.AppImage'
          appimage-command: '"$APPIMAGE" --self-test'
          # The chain ORT stays unpatched for G6 and loads through preload.list, which ldd cannot follow.
          scan-elves: 'false'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Verify package licences, third-party notice and logo
        run: bash scripts/linux/check-package-licenses.sh "$RUNNER_TEMP/clean-host-packages/packages"
