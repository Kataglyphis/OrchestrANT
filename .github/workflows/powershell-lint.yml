# .github/workflows/powershell-lint.yml
# THE GAP THIS CLOSES: until now nothing linted this repo's PowerShell at all.
# scripts/windows/Build-Windows.ps1 is 400 lines that drive the whole Windows
# lane, and scripts/windows/Resolve-BuildModule.ps1 is the bootstrap every one
# of them goes through -- and a syntax error in either was discovered by running
# them. The Linux half has had the hub's six-gate aggregator since 2026-09-12;
# this is its Windows counterpart.
#
# The gate is the HUB's, not a copy:
# third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1 runs a mandatory
# parse pass, an AST-trap pass (comma-attribute quoting, switch shadowing, glued
# parameter tokens) and PSScriptAnalyzer against the hub's own
# windows/PSScriptAnalyzerSettings.psd1 -- consumed by reference, so this repo
# copies no ruleset. -Path points it at THIS tree; without it the script lints
# the hub's own scope.
#
# -FailOnAnalyzer, not advisory. The hub's own lane made the same move on
# 2026-09-08 with the reason that applies here too: without the switch the step
# prints findings and exits 0, which is a check that cannot fail. This repo's
# one finding was triaged first (Build-Windows.ps1's Write-Log shadowed a
# built-in cmdlet; it is Write-LogInfo now), so the lane starts green rather
# than starting with an exception.
#
# The dev-box command is the same string, through the same wrapper shape the
# lint-gates lane uses:  pwsh -File scripts/windows/Invoke-Lint.ps1
#
# runs-on is pinned to windows-2025, never windows-latest: the alias resolves to
# windows-2025 today and moves on GitHub's schedule, which would change the OS
# image under a green build with no commit to blame.

name: PowerShell lint

on:
  push:
    branches: ["main"]
    paths:
      - 'scripts/windows/**'
      - 'third_party/ANTfrastructure'
      - '.github/workflows/powershell-lint.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'scripts/windows/**'
      - 'third_party/ANTfrastructure'
      - '.github/workflows/powershell-lint.yml'

permissions:
  contents: read

concurrency:
  group: powershell-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-lint:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # submodules: true, top-level only -- the gate and its ruleset both live in
      # third_party/ANTfrastructure. fetch-depth 1 is enough: nothing here reads
      # history.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      # Pinned to the version the hub's own lane installs. An unpinned install
      # would let a new analyzer release add a rule that fails this lane with no
      # commit to blame -- the same argument the ruff pin in pyproject.toml makes.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Lint (parse gate + AST traps + PSScriptAnalyzer)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/windows/Invoke-Lint.ps1
