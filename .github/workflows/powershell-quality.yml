name: Windows x64 · PowerShell quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on analyzer findings and, for this dispatch, complexity findings
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/powershell-quality.yml@develop
    with:
      lint-path: scripts/windows
      # Complexity is fatal on push and PR; a dispatch without strict only measures.
      strict: ${{ github.event_name != 'workflow_dispatch' || inputs.strict == true }}
      analyzer-strict: ${{ inputs.strict == true }}
