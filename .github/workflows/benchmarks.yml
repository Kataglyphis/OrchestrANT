name: Benchmarks

on:
  push:
    paths:
      - "benchmarks/**"
      - "orchestrant/benchmark/**"
      - "tests/unit/benchmark/**"
      - ".github/workflows/benchmarks.yml"
      - "frontend/**"
      - "tests/unit/frontend/**"
  pull_request:
    paths:
      - "benchmarks/**"
      - "orchestrant/benchmark/**"
      - "tests/unit/benchmark/**"
      - ".github/workflows/benchmarks.yml"
      - "frontend/**"
      - "tests/unit/frontend/**"

permissions:
  contents: read

jobs:
  offline:
    name: offline suites
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The registry the tests grade (linux/llm-stack/backends.json) is hub-owned.
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The live modules skip themselves without a server.
      - name: pytest
        run: uv run --extra test pytest benchmarks/tests tests/unit/benchmark -q -p no:unraisableexception

  contract:
    name: v1 API contract (live ollama)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      ollama:
        # Digest-pinned for a hermetic run; bump by re-resolving the digest on purpose.
        image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true  # the hub owns backends.json, which the suite grades
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Wait for ollama, pull the micro model, run the contract tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          TEST_TIMEOUT: "60"
        run: uv run --extra test bash benchmarks/ci-contract-tests.sh "${OLLAMA_BASE_URL}"

  viewer:
    name: viewer data + import
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The reflex pin mirrors uv.lock; the page compile catches errors the import alone misses.
      - name: Viewer data tests and page compile
        run: uv run --no-project --with "reflex==0.9.6.post1" --with pytest python -m pytest tests/unit/frontend -q
      - name: Reflex app imports
        working-directory: frontend
        run: uv run --no-project --with "reflex==0.9.6.post1" python -c "import frontend.frontend"
