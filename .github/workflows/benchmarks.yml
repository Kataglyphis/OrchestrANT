name: benchmarks

# The LLM benchmark lab (benchmarks/) and its runner (orchestrant.benchmark).
# The offline job runs both pytest trees; the contract job runs them against a
# digest-pinned ollama service; the viewer job builds the React app and renders
# its server-side smoke against the tracked results.

on:
  push:
    paths:
      - "benchmarks/**"
      - "orchestrant/benchmark/**"
      - "tests/unit/benchmark/**"
      - ".github/workflows/benchmarks.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - "orchestrant/benchmark/**"
      - "tests/unit/benchmark/**"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: read

jobs:
  offline:
    name: offline suites
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The named-backend registry the tests grade is hub-owned
          # (linux/llm-stack/backends.json); without it the suite has no
          # registry to check.
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      # The live modules skip themselves without a server; a green offline run
      # says the measuring and grading paths hold together.
      - name: pytest
        run: uv run --extra test pytest benchmarks/tests tests/unit/benchmark -q -p no:unraisableexception

  contract:
    name: v1 API contract (live ollama)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      ollama:
        # Digest-pinned: a mutable tag made this non-hermetic. Bump by
        # re-resolving the digest deliberately, not implicitly.
        image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true  # the hub owns backends.json, which the suite grades
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Wait for ollama, pull the micro model, run the contract tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          TEST_TIMEOUT: "60"
        run: uv run --extra test bash benchmarks/ci-contract-tests.sh "${OLLAMA_BASE_URL}"

  viewer:
    name: viewer data + import
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      # The tables, the Wilson intervals and the manifest shaping are pure
      # Python in frontend/frontend/benchmark_data.py; test them without Reflex.
      - name: Viewer data tests
        run: uv run --no-project --with pytest python -m pytest tests/unit/frontend -q
      # Then prove the Reflex app module imports against the pinned version. The
      # pin below mirrors uv.lock's reflex (0.9.6.post1); page compilation is
      # `reflex run`'s job locally.
      - name: Reflex app imports
        working-directory: frontend
        run: uv run --no-project --with "reflex==0.9.6.post1" python -c "import frontend.frontend"
