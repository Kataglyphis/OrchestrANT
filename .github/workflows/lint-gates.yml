# Must keep saying what scripts/linux/run-lint-gates.sh says: both pass --ratchets to one aggregator.

name: Lint gates

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  lint-gates:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      ratchets: true
      agents-drift: true
      # Measured clean of tag-pinned actions, so the sha-pin convention is enforced here.
      workflow-conventions: sha-pin
