name: Linux riscv64 · build + test

# The riscv64 image runs under QEMU on an amd64 runner: the hub's python-ci-linux.yml tests and builds the arch-specific wheel; the app packages stay amd64-arm64 (see third_party/ANTfrastructure/docs/python-ci.md).

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: linux-riscv64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/python-ci-linux.yml@develop
    with:
      arches: riscv64
      package-name: orchestrant
      # One leg: the riscv64 image carries the GIL build only.
      test-python-versions: '3.14'
      # The full extra set builds wheels from source under QEMU; the test extra gates.
      test-extras: test
      # The wheel is arch-specific (a Cython build); the app packages stay amd64-arm64.
      package-emulated: true
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
