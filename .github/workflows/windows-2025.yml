# .github/workflows/windows-2025.yml
name: Windows 2025 Workflow

# The lane lives in ContainerHub as a reusable workflow; this file is only its
# configuration. Do not re-inline the steps: this repo and
# Kataglyphis-WebDavClient previously carried ~70-line copies that differed on
# 20 lines, all of it drift rather than intent.
#
# Adopting the shared lane changes three things here, all deliberate:
#   * artifacts now upload on always(), so a failing build keeps its logs
#   * logs/ and docs/test_results/ are included, not just dist/
#   * upload-artifact moves v6 -> v7 (WebDavClient was already there)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    uses: Kataglyphis/ContainerHub/.github/workflows/python-ci-windows.yml@main
    with:
      # Shallow checkout is fine here: the version comes from VERSION.txt, not git.
      fetch-depth: 1
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
