name: Build + test + run on Linux natively - x86-64/arm64

# The whole lane lives in ContainerHub as a reusable workflow. This file is the
# configuration for it, nothing more. Do not re-inline the steps here: this repo
# and Kataglyphis-WebDavClient previously carried 112-line copies that differed
# on 14 lines, all of them parameters.
#
# Two former "differences" were phantoms and are gone: passing '3.14' to
# ci_static_analysis.sh and ci_packaging.sh is exactly what those drivers
# already default to. Only the test matrix and the docs interpreter are real
# overrides for this repo.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  linux:
    uses: Kataglyphis/ContainerHub/.github/workflows/python-ci-linux.yml@main
    with:
      # The importable module, not the distribution name ("OrchestrANT").
      package-name: orchestrant
      test-python-versions: '3.13 3.14 3.14t'
      docs-python-version: '3.14'
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      # This repo stores the FTP password as PW; WebDavClient calls it PASSWORD.
      # The reusable workflow takes a neutral name so neither repo has to rename.
      FTP_PASSWORD: ${{ secrets.PW }}
