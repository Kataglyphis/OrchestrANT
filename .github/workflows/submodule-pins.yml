# Only the triggers are local; the Pester pins and the suite wiring live in the hub's reusable lane.

name: Submodule pins

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'

permissions:
  contents: read

concurrency:
  group: submodule-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Submodule pins sit at their recorded commits
    uses: Kataglyphis/ANTfrastructure/.github/workflows/submodule-pins.yml@develop
