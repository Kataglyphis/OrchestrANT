  "numpy>=2.1.0",
  # No riscv64 wheel (the hub source-builds one); keep in sync with the hub's IREE_VERSION.
  "iree-base-compiler; platform_machine != 'riscv64'",
  "iree-base-runtime; platform_machine != 'riscv64'",
  "onnxruntime-rocm; sys_platform == 'linux' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'riscv64'",
]

test = [
    # atheris ships manylinux x86_64 wheels only; elsewhere it needs a Clang with libFuzzer.
    "atheris; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pytest",
    "requests",                                         # benchmark live-contract tests
    "pre-commit",
    "line_profiler",                                    # line-by-line profiling
    "pytest-benchmark",                                 # benchmark tests
    "memory-profiler",                                  # memory profiling
    "py-spy; platform_machine != 'riscv64'",            # profiling
    "pytest-cov",
    "pytest-md-report",
    "pytest-md",
    "pytest-html",
    "codespell",
    "bandit",                                           # find security vulnerabilities
    "vulture",                                          # find dead code
    # Equals the hub's RUFF_VERSION (versions.env); the consumer-pins gate fails on drift.
    "ruff==0.16.8",                                     # replacement for flake8
    "ty; platform_machine != 'riscv64'",                # type checking
]

docs = [
  "sphinx",
  "sphinx-book-theme",
  "myst-parser",
  "sphinx-design"
]

gpu = [
  "onnxruntime-gpu; sys_platform != 'darwin' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'riscv64'",
  # Same pin as onnxruntime-genai in the ml-ai extra.
  "onnxruntime-genai-cuda==0.15.2; sys_platform != 'darwin' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'riscv64'",
  "nvidia-ml-py",
]

gpu-nvidia = [
  "onnxruntime-gpu; sys_platform != 'darwin' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'riscv64'",
  # Same pin as onnxruntime-genai in the ml-ai extra.
  "onnxruntime-genai-cuda==0.15.2; sys_platform != 'darwin' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'riscv64'",
  "nvidia-ml-py",
]

gpu-directml = [
  "onnxruntime-directml; sys_platform == 'win32'",
  # Unpinned: PyPI has no directml wheel at the hub's version; the hub's source-built wheels replace it.
  "onnxruntime-genai-directml; sys_platform == 'win32'",
  "nvidia-ml-py",
]

gpu-rocm = [
  # onnxruntime-rocm is source-built only; amdsmi names the card, and without it the monitor uses sysfs.
  "amdsmi; sys_platform == 'linux'",
]

backend =[
    "psycopg"
]

# add this packaging extra for tools used only in build/CI steps:
packaging = [
  "auditwheel>=4.0",    # CLI tool for repairing manylinux wheels
  "twine",              # if you need to upload artifacts
]

# CPU (default); every extra's torch pins equal the hub's PYTORCH_VERSION/TORCHVISION_VERSION.
pytorch-cpu = [
  "captum; platform_machine != 'riscv64'",
  "torch==2.14.0; platform_machine != 'riscv64'",
  "torchvision==0.29.0; platform_machine != 'riscv64'",
  "torch @ git+https://github.com/pytorch/pytorch.git@v2.14.0 ; platform_machine == \"riscv64\"",
  "torchvision @ git+https://github.com/pytorch/vision.git@v0.29.0 ; platform_machine == \"riscv64\""
]
# CUDA 13.0: the cu130 index ships Linux/Windows wheels only, hence the darwin exclusion.
pytorch-cu130 = [
  "captum; platform_machine != 'riscv64'",
  "torch==2.14.0; platform_machine != 'riscv64' and sys_platform != 'darwin'",
  "torchvision==0.29.0; platform_machine != 'riscv64' and sys_platform != 'darwin'",
  "torch @ git+https://github.com/pytorch/pytorch.git@v2.14.0 ; platform_machine == \"riscv64\"",
  "torchvision @ git+https://github.com/pytorch/vision.git@v0.29.0 ; platform_machine == \"riscv64\""
