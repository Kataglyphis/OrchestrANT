# Example scripts are run by path (README § Demos), not imported as a package.
"examples/*.py" = ["INP001"]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.pylint]
max-args = 7        # ML functions often need more params
max-branches = 15   # Complex logic in data loading
max-statements = 60 # Training loops are verbose
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[tool.ruff.lint.flake8-type-checking]
strict = true  # Stricter type checking imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# ty
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["orchestrant", "scripts/"]
exclude = [
    "**/__pycache__",
    "*.tmp",
    "build/",
    "dist/",
    ".venv/",
]
respect-ignore-files = true

[tool.ty.rules]
# Every rule is an error except these two.
possibly-missing-attribute = "ignore"  # mlflow uses lazy-loading API

# Per-line optional-import ignores are redundant or needed depending on the installed extras.
unused-ignore-comment = "ignore"

# uv: one PyTorch index per extra keeps CPU/CUDA/ROCm installs mutually exclusive
[tool.uv]
# riscv64 has no public torch wheel, so it resolves fresh at `uv sync` (--frozen falls back) instead of locking.
environments = [
  "sys_platform == 'linux' and platform_machine != 'riscv64'",
  "sys_platform == 'darwin'",
  "sys_platform == 'win32'",
]
conflicts = [
  [
    { extra = "ml-ai" },
    { extra = "ml-ai-webgpu" },
  ],
  [
    { extra = "ml-ai" },
    { extra = "ml-ai-nvidia" },
  ],
  [
    { extra = "ml-ai" },
    { extra = "ml-ai-rocm" },
  ],
  [
    { extra = "ml-ai-webgpu" },
    { extra = "ml-ai-nvidia" },
  ],
  [
