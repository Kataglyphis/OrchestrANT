[build-system]
requires = ["setuptools>=77.0", "wheel", "cython"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrant*"]
exclude = ["test*", "data*", "docs*", "demo*", "bench*"]
namespaces = false

[tool.setuptools.dynamic]
version = { file = "VERSION.txt" }

# setup.py's cython branch passes its own package_data, which replaces this table: keep both lists equal.
[tool.setuptools.package-data]
orchestrant = ["streaming/template-files/*.html"]

[project]
name = "OrchestrANT"
dynamic = ["version"]
authors = [
  {name = "Jonas Heinle", email = "jonasheinle@googlemail.com"} 
]
description = "Python AI prototyping template and package: camera pipelines, YOLO monitoring, streaming, system/GPU metrics — plus the family LLM benchmark lab and its Reflex viewer."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "machine-learning", "computer-vision", "yolo", "monitoring", "pipeline",
  "onnxruntime", "gstreamer",
  # The repo is also the LLM benchmark lab, its Reflex viewer and a project template.
  "llm", "benchmark", "llm-benchmark", "reflex", "template",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.14t",
]

dependencies = [
  "tqdm", 
  "loguru",
  "psutil",
  "pyyaml",
  "cython", 
  "hydra-core",
  "matplotlib",        # Visualization
  "py-cpuinfo",        # CPU info
  "flask",
]

[project.scripts]
yolo-monitor = "orchestrant.yolo.monitor:run_yolo_monitor"
orchestrant-smoke = "orchestrant.smoke.__main__:main"
orchestrant-bench = "orchestrant.benchmark.__main__:main"

[project.optional-dependencies]
frontend = [
  # wxPython has no 3.14 wheel and its sdist does not build there.
  "wxPython; python_version < '3.14'",
  "reflex; platform_machine != 'riscv64'",  # Reflex does not support RISC-V yet
]

ml-ai = [
  "pandas",
  "opencv-python; platform_machine != 'riscv64'",
  "opencv-python @ git+https://github.com/opencv/opencv-python.git ; platform_machine == 'riscv64'",
  "mlflow; platform_machine != 'riscv64'",
  "optuna",
  "boto3; platform_machine != 'riscv64'",
  "scipy",
  "scikit-learn",
  "ai-edge-litert",
  "numpy>=2.1.0",
  # No riscv64 wheel (the hub source-builds one); keep in sync with the hub's IREE_VERSION.
  "iree-base-compiler; platform_machine != 'riscv64'",
  "iree-base-runtime; platform_machine != 'riscv64'",
  "onnxruntime; platform_machine != 'riscv64'",  # CPU version for ARM, GPU version for x86_64
  # The hub's ONNXRUNTIME_GENAI_VERSION minus its "v"; it moves with ONNXRUNTIME_VERSION, so bump it in versions.env.
  "onnxruntime-genai==0.15.2; platform_machine != 'riscv64'",
]

# One ML variant per onnxruntime flavour; [tool.uv] conflicts keeps them exclusive.
ml-ai-webgpu = [
  "pandas",
  "opencv-contrib-python; platform_machine != 'riscv64'",
  "opencv-python @ git+https://github.com/opencv/opencv-python.git ; platform_machine == 'riscv64'",
  "mlflow; platform_machine != 'riscv64'",
  "optuna",
  "boto3; platform_machine != 'riscv64'",
  "scipy",
  "scikit-learn",
  "ai-edge-litert",
  "numpy>=2.1.0",
  # No riscv64 wheel (the hub source-builds one); keep in sync with the hub's IREE_VERSION.
  "iree-base-compiler; platform_machine != 'riscv64'",
  "iree-base-runtime; platform_machine != 'riscv64'",
  "onnxruntime-webgpu; platform_machine != 'riscv64'",
]

ml-ai-nvidia = [
  "pandas",
  "opencv-contrib-python; platform_machine != 'riscv64'",
  "opencv-python @ git+https://github.com/opencv/opencv-python.git ; platform_machine == 'riscv64'",
  "mlflow; platform_machine != 'riscv64'",
  "optuna",
  "boto3; platform_machine != 'riscv64'",
  "scipy",
  "scikit-learn",
  "ai-edge-litert",
  "numpy>=2.1.0",
  # No riscv64 wheel (the hub source-builds one); keep in sync with the hub's IREE_VERSION.
  "iree-base-compiler; platform_machine != 'riscv64'",
  "iree-base-runtime; platform_machine != 'riscv64'",
  "onnxruntime-gpu; sys_platform != 'darwin' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'riscv64'",
]

ml-ai-rocm = [
  "pandas",
  "opencv-contrib-python; platform_machine != 'riscv64'",
  "opencv-python @ git+https://github.com/opencv/opencv-python.git ; platform_machine == 'riscv64'",
  "mlflow; platform_machine != 'riscv64'",
  "optuna",
  "boto3; platform_machine != 'riscv64'",
