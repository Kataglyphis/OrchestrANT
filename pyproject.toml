[project.urls]
Homepage = "https://github.com/Kataglyphis/OrchestrANT"

[tool.pytest.ini_options]
# 7.0: pytest 6 ignores `pythonpath` below silently.
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
# The `pytest` script does not put the repo root on sys.path; a tests/__init__.py would clash with benchmarks/tests.
pythonpath = ["."]
filterwarnings = ["error", "ignore::DeprecationWarning"]
xfail_strict = true


[tool.vulture]
exclude = [
    'data/',
    'models/',
]

# 100 flags only unused parameters and dead code; 60 flags framework-owned names (Sphinx, Flask, mocks).
min_confidence = 100  # vulture's pyproject keys use underscores, not dashes

[tool.codespell]
# `*.c` (Cython output) and `benchmark_results` (recorded model output) are bare: skip matches file names only.
skip = "./.venv/*,./logs/*,./docs/test_results/*,./docs/test_results/**,./resources/models/*.onnx,./resources/models/**/*.onnx,benchmark_results,*.c"
# Real words here: tvm.nd, DocumANTation, a prompt's `froms`, "unparseable"; German lines are excused inline.
ignore-words-list = "nd,documantation,froms,unparseable"
# Excused here, not inline: openai_api.py's bytes are part of tool_sha256.
ignore-regex = '"Ans\(s\)"'

# Ruff
[tool.ruff]
line-length = 88  # Black-compatible (industry standard)
target-version = "py313"
# The submodule has its own lint profile and agent worktrees are other checkouts.
extend-exclude = ["third_party", ".claude"]

[tool.ruff.lint]
# Enable all rules, then selectively ignore only what's absolutely necessary
select = ["ALL"]

ignore = [
    # Formatter conflicts (REQUIRED - these conflict with ruff format)
    "COM812",   # missing trailing comma
    "ISC001",   # implicit string concat
    
    # Docstring style conflicts (REQUIRED - mutually exclusive rules)
    "D203",     # one-blank-line-before-class (conflicts with D211)
    "D213",     # multi-line-summary-second-line (conflicts with D212)
    
    # Line length in docstrings (hard to avoid, formatter handles code)
    "E501",     # line too long (docstrings/comments; code handled by formatter)
    
    # Exception handling - intentional for graceful degradation with external libs
    "BLE001",   # blind exception (needed for mlflow/optional dependencies)
    
    # Pylint - slightly relaxed for complex ML code
    "PLR0913",  # too many arguments (ML functions often need many params)
    "PLR2004",  # magic values (common in ML: batch sizes, dimensions)

    # Copyright headers: not used, by choice
    "CPY001",   # missing-copyright-notice (LICENSE covers the whole tree)
]

# Stricter settings
unfixable = []  # Allow all auto-fixes
explicit-preview-rules = true  # Opt-in to preview rules explicitly

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**/*.py" = ["S101", "PLR2004"]
# Smoke checks import lazily so a broken wheel fails its check, not the import; the runner prints by design.
"orchestrant/smoke/*.py" = ["PLC0415"]
"orchestrant/smoke/__main__.py" = ["T201"]
