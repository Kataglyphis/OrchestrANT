# The lab half (benchmarks/): the same port, frozen the same way.
"benchmarks/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ARG001", "ARG002", "ARG005", "B023", "B905", "C408", "C901", "D101", "D102", "D103", "D205", "D209", "D301", "D403", "E402", "E731", "E741", "EM101", "EM102", "F401", "F541", "FBT002", "FURB167", "FURB188", "I001", "INP001", "ISC004", "N802", "N818", "PERF401", "PLC0415", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLW0603", "PLW1509", "PLW1510", "PLW1641", "PLW2901", "PT006", "PT011", "PT018", "PTH100", "PTH103", "PTH105", "PTH107", "PTH110", "PTH111", "PTH112", "PTH118", "PTH119", "PTH120", "PTH123", "PTH208", "RUF001", "RUF005", "RUF012", "RUF015", "RUF021", "RUF059", "RUF100", "S101", "S105", "S108", "S310", "S603", "S607", "SIM105", "SIM114", "SIM115", "SLF001", "T201", "TRY003", "UP017", "UP031"]
"benchmarks/tests/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ARG001", "ARG002", "ARG005", "B023", "B905", "C408", "C901", "D101", "D102", "D103", "D205", "D209", "D301", "D403", "E402", "E731", "E741", "EM101", "EM102", "F401", "F541", "FBT002", "FURB167", "FURB188", "I001", "INP001", "ISC004", "N802", "N818", "PERF401", "PLC0415", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLW0603", "PLW1509", "PLW1510", "PLW1641", "PLW2901", "PT006", "PT011", "PT018", "PTH100", "PTH103", "PTH105", "PTH107", "PTH110", "PTH111", "PTH112", "PTH118", "PTH119", "PTH120", "PTH123", "PTH208", "RUF001", "RUF005", "RUF012", "RUF015", "RUF021", "RUF059", "RUF100", "S101", "S105", "S108", "S310", "S603", "S607", "SIM105", "SIM114", "SIM115", "SLF001", "T201", "TRY003", "UP017", "UP031"]
# The Reflex viewer and its tests: today's codes frozen, like the bench subtrees.
"frontend/*.py" = ["ANN001", "ANN003", "ANN201", "ANN202", "ANN401", "D101", "D102", "D103", "D205", "D209", "I001", "INP001", "PLC0415", "PT018", "RUF001", "RUF012"]
