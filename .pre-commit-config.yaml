repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Kept equal to the "ruff==..." pin in pyproject.toml, which in
    # turn follows ANTfrastructure linux/scripts/01-core/versions.env RUFF_VERSION.
    # Nothing invokes pre-commit in CI today, so a third ruff version could sit
    # here unnoticed until someone runs the hook and gets a different verdict
    # from the same tree.
    rev: v0.16.7
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format